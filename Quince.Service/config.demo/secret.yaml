# config/secret.yaml
# Опционально — сервисный(е) аккаунт(ы) AD для двухфазного LDAP-входа (см. bind_secret в
# ldap.yaml): сервисный аккаунт ищет пользователя по имени и его группы, затем пароль проверяется
# отдельным re-bind под учётными данными самого входящего. Без этого файла (или без соответствующего
# id) LDAP всё равно работает — однофазным bind под учётными данными самого пользователя, только
# диагностика ошибок менее точная.

authorization:
  - id: 10
    username: "ldap-readonly"
    password: "change-me"
    domain: "CORP"
