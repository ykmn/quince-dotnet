# config/users.yaml
# Локальные пользователи (используются при Local: true в ldap.yaml).
#
# is_admin: true  — полный доступ: управление каналами (создание/редактирование/клонирование/
#                   удаление/старт-стоп записи, массовое изменение), настройки приложения, обновление
#                   конфигурации, монитор ресурсов.
# is_admin: false — доступ только на просмотр: список каналов, индикаторы уровня, прослушивание в
#                   браузере — без управления (см. README.md, раздел «Авторизация»).
#
# password_hash — BCrypt-хэш. Генерируется без внешних скриптов, прямо самим exe:
#     Quince.Service.exe --hash-password
# Демонстрационный хэш ниже соответствует паролю "changeme" — обязательно замените перед
# реальным использованием.

users:
  - username: admin
    password_hash: "$2a$11$s01rRaLKY4iB2f0a4Ow87.9yt7QsjQzUkSBruPT6i/9glRnNOPtyy"
    is_admin: true
