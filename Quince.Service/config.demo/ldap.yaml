# config/ldap.yaml
#
# Если этот файл ОТСУТСТВУЕТ в папке config/ — авторизация отключена, приложение открывается без
# запроса входа (поведение по умолчанию). Если файл присутствует — открывается страница /login,
# доступная одним или обоими способами ниже.
#
# Local/LDAP — единственные два ключа, которые пишутся с заглавных букв; всё остальное в этом
# файле — строчными с подчёркиванием, как и в остальных конфигах Айвы.

# ── Локальная аутентификация (учётные записи из config/users.yaml) ────────────
Local: true

# ── Доменная аутентификация (Windows Active Directory / LDAP) ─────────────────
LDAP: false

# Группы AD, участники которых получают IsAdmin — полный доступ к управлению каналами и
# приложением (см. README.md, раздел «Авторизация»). Не входящие сюда аутентифицированные
# пользователи получают доступ только на просмотр.
admin_groups:
  - "CN=RadioAdmins,OU=Groups,DC=corp,DC=local"

# Если задать непустым — входить смогут только участники этих групп, остальные аутентифицированные
# доменные пользователи получат отказ. Пусто/не задано (по умолчанию) — входит любой, кто успешно
# прошёл аутентификацию в одном из доменов ниже.
# access_groups:
#   - "CN=RadioUsers,OU=Groups,DC=corp,DC=local"

# ── Вариант 1: один домен ──────────────────────────────────────────────────────
server: "ldap://dc01.corp.local"    # URL LDAP-сервера (или :3268 для Global Catalog)
domain: "CORP"                       # NetBIOS-имя домена
base_dn: "DC=corp,DC=local"          # корень поиска в каталоге

# Сервисный аккаунт AD для поиска пользователя перед проверкой его пароля (read-only).
# Ссылается на запись в config/secret.yaml по полю id. Необязателен — без него используется прямой
# bind под учётными данными самого входящего пользователя (менее точная диагностика ошибок).
# bind_secret: 10

# ── Вариант 2: несколько доменов / доверенные домены ───────────────────────────
#
# Пользователь может входить как:
#   ivanov            — поиск последовательно во всех доменах ниже
#   CORP\ivanov        — явное указание домена по полю 'name'
#   ivanov@corp.local  — явное указание по UPN-суффиксу (выводится из base_dn, либо upn_suffix)
#
# domains:
#   - name: "CORP"
#     server: "ldap://dc01.corp.local"
#     base_dn: "DC=corp,DC=local"
#     bind_secret: 10
#
#   - name: "PARTNER"
#     server: "ldap://dc01.partner.local"
#     base_dn: "DC=partner,DC=local"
#     bind_secret: 11
#     # admin_groups / access_groups можно переопределить для конкретного домена:
#     # admin_groups: [...]
