<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Background circle -->
  <circle cx="300" cy="300" r="290" fill="#FFF8D6" stroke="#E8D44D" stroke-width="4"/>

  <!-- Quince fruit body - lower pear bulge -->
  <ellipse cx="300" cy="355" rx="115" ry="130" fill="#FFD700"/>
  <!-- Upper narrower neck -->
  <ellipse cx="300" cy="235" rx="68" ry="82" fill="#FFD700"/>
  <!-- Blend seam between upper and lower -->
  <rect x="232" y="235" width="136" height="120" fill="#FFD700"/>

  <!-- Subtle shading on the right side for depth -->
  <ellipse cx="360" cy="340" rx="60" ry="110" fill="#F0BC00" opacity="0.45"/>
  <ellipse cx="355" cy="220" rx="35" ry="65" fill="#F0BC00" opacity="0.35"/>

  <!-- Stem -->
  <rect x="295" y="142" width="10" height="44" rx="5" fill="#7A5C10"/>

  <!-- Green leaf -->
  <ellipse cx="335" cy="152" rx="46" ry="17" fill="#4CAF50" transform="rotate(-32 335 152)"/>
  <!-- Leaf vein -->
  <line x1="308" y1="158" x2="360" y2="143" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Highlight — soft white sheen on upper left -->
  <ellipse cx="262" cy="285" rx="28" ry="42" fill="rgba(255,255,255,0.32)" transform="rotate(-10 262 285)"/>
  <!-- Small secondary highlight near top -->
  <ellipse cx="275" cy="205" rx="14" ry="20" fill="rgba(255,255,255,0.25)" transform="rotate(-10 275 205)"/>

  <!-- Subtle bottom shadow inside fruit -->
  <ellipse cx="300" cy="465" rx="90" ry="22" fill="#C8A000" opacity="0.18"/>
</svg>
