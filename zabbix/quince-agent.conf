# Include this file from zabbix_agentd.conf (classic Agent v1; Agent 2 is also supported).
# Install quince-monitoring.ps1 at this exact path, or adjust the command below.
# Set Timeout=10 in the MAIN agent configuration. No flexible parameters are used.
UserParameter=quince.monitoring.get,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\Zabbix\quince\quince-monitoring.ps1" -Endpoint "http://127.0.0.1:5000/api/monitoring/zabbix"
